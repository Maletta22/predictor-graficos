<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predictor de gráficos</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Librería de gráficos de TradingView, versión fija (ver CLAUDE.md) -->
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <main>
    <h1>¿Sube o baja?</h1>
    <p class="subtitle">
      Un gráfico real de un activo y unas fechas secretas.
      La última vela vale 100.
    </p>

    <!-- Zona de juego: gráfico a la izquierda, panel lateral a la derecha
         (en pantallas estrechas, el panel pasa debajo del gráfico) -->
    <div class="game">
      <!-- Aquí dibuja chart.js el gráfico -->
      <div id="chart"></div>

      <aside class="side">
        <!-- Paso 1: el usuario decide -->
        <div id="choice" class="panel">
          <p>¿Qué hará el precio en las próximas 20 velas?</p>
          <div class="buttons">
            <button id="guess-up" class="up">▲ Sube</button>
            <button id="guess-down" class="down">▼ Baja</button>
          </div>
        </div>

        <!-- Paso 2: se revela el resultado (oculto hasta que el usuario responde) -->
        <div id="result" class="panel hidden">
          <p id="result-title" class="result-title"></p>
          <p id="result-change"></p>
          <dl>
            <dt>Activo</dt>
            <dd id="result-asset"></dd>
            <dt>Fechas</dt>
            <dd id="result-dates"></dd>
            <dt>Precio al decidir</dt>
            <dd id="result-price-start"></dd>
            <dt>Precio 20 velas después</dt>
            <dd id="result-price-end"></dd>
          </dl>
          <button id="next-round">Siguiente gráfico</button>
        </div>
      </aside>
    </div>

    <p id="message" class="message"></p>

    <!-- Estadísticas del jugador (las rellena main.js) -->
    <section class="panel stats">
      <h2>Tus estadísticas</h2>
      <div class="stats-grid">
        <div><span id="stat-played" class="stat-value"></span>rondas</div>
        <div><span id="stat-correct" class="stat-value"></span>aciertos</div>
        <div><span id="stat-pct" class="stat-value"></span>de acierto</div>
        <div><span id="stat-streak" class="stat-value"></span>racha actual</div>
        <div><span id="stat-best" class="stat-value"></span>mejor racha</div>
      </div>

      <p id="stat-chance" class="chance"></p>

      <table>
        <thead>
          <tr><th>Mercado</th><th>Rondas</th><th>Aciertos</th><th>% acierto</th></tr>
        </thead>
        <tbody id="stat-markets"></tbody>
      </table>

      <p class="stats-footer">
        <span id="stat-ties"></span>
        <button id="reset-stats" class="link">Borrar estadísticas</button>
      </p>
    </section>
  </main>

  <!-- type="module" permite usar import/export entre nuestros archivos JS -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
