<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predictor de gráficos</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Librería de gráficos de TradingView, versión fija (ver CLAUDE.md) -->
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <main>
    <h1>¿Sube o baja?</h1>
    <p class="subtitle">
      Un gráfico real de un activo y unas fechas secretas.
      La última vela vale 100.
    </p>

    <!-- Aquí dibuja chart.js el gráfico -->
    <div id="chart"></div>

    <p id="message" class="message"></p>

    <!-- Paso 1: el usuario decide -->
    <div id="choice" class="choice">
      <p>¿Qué hará el precio en las próximas 20 velas?</p>
      <button id="guess-up" class="up">▲ Sube</button>
      <button id="guess-down" class="down">▼ Baja</button>
    </div>

    <!-- Paso 2: se revela el resultado (oculto hasta que el usuario responde) -->
    <div id="result" class="result hidden">
      <p id="result-title" class="result-title"></p>
      <p id="result-change"></p>
      <p id="result-asset"></p>
      <button id="next-round">Siguiente gráfico</button>
    </div>
  </main>

  <!-- type="module" permite usar import/export entre nuestros archivos JS -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
